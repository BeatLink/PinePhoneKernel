name: Build kernel and publish binary cache

on:
  push:
    branches: [main]
  schedule:
    # Weekly, to pick up nixpkgs. A toolchain or stdenv change gives a new
    # derivation, so the cache goes cold on its own without this.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

# Do not cancel in progress: a half published cache is worse than a late one.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    # Free native aarch64 for public repositories. Emulated x86_64 runners take
    # several times longer for the same build.
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      # Runners ship ~25GB of toolchains this build has no use for, and a kernel
      # tree plus its build output does not comfortably fit around them.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The previously published cache becomes a local substituter, so an
      # unchanged derivation is fetched rather than rebuilt -- a no-op week is a
      # two minute job instead of an hour. Absent on the very first run.
      - name: Seed the store from the last published cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/previous-cache
          if gh release download --pattern binary-cache.tar.zst --dir /tmp --clobber; then
            tar -x --zstd -f /tmp/binary-cache.tar.zst -C /tmp/previous-cache
            echo "seeded $(ls /tmp/previous-cache/*.narinfo 2>/dev/null | wc -l) narinfos"
          else
            echo "no previous release to seed from"
          fi

      # Checked before the build, not after. Discovering a missing secret at the
      # signing step would mean an hour of compilation thrown away.
      - name: Check signing key is available
        env:
          CACHE_PRIV_KEY: ${{ secrets.CACHE_PRIV_KEY }}
        run: |
          if [ -z "${CACHE_PRIV_KEY:-}" ]; then
            echo "::error::CACHE_PRIV_KEY secret is not set. Generate with:"
            echo "  nix-store --generate-binary-cache-key \\"
            echo "    pinephone-kernel-1 cache-priv-key.pem cache-pub-key.pem"
            echo "then add the private half as the CACHE_PRIV_KEY repository secret."
            exit 1
          fi
          echo "signing key present"

      # ^* selects ALL outputs. This kernel has three -- out, dev and modules --
      # and a plain `.#linux-pinephone-megi` means only `out`. Publishing just
      # that looks like it works, because the kernel image substitutes fine, and
      # then every consumer silently rebuilds the whole kernel to recover the
      # missing outputs: `modules` holds the modules themselves and `dev` is the
      # build tree that out-of-tree modules such as ZFS compile against.
      - name: Build kernel (all outputs)
        run: |
          nix build '.#linux-pinephone-megi^*' --print-build-logs \
            --extra-substituters "file:///tmp/previous-cache" \
            --extra-trusted-public-keys "pinephone-kernel-1:Bh9JYKdNDBNwefy+ZrjHKjVUR453bPDXRMZ+kO9K33w="

      - name: Sign and export binary cache
        env:
          CACHE_PRIV_KEY: ${{ secrets.CACHE_PRIV_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$CACHE_PRIV_KEY" > /tmp/cache-priv-key.pem

          mkdir -p site
          # Writes nix-cache-info, the .narinfo files and nar/, signed on the
          # way out. This is the entire binary cache protocol -- no server.
          nix copy \
            --to "file://$PWD/site?compression=zstd&secret-key=/tmp/cache-priv-key.pem" \
            '.#linux-pinephone-megi^*'

          shred -u /tmp/cache-priv-key.pem

          # Assert every output actually landed. Publishing a partial closure is
          # the failure mode this whole step exists to avoid, and it is invisible
          # from the outside: the cache answers 200 for the kernel image and 404
          # for the build tree, so consumers rebuild everything without a word.
          missing=0
          for p in $(nix build --no-link --print-out-paths '.#linux-pinephone-megi^*'); do
            h=$(basename "$p" | cut -d- -f1)
            if [ -f "site/$h.narinfo" ]; then
              echo "  ok      $(basename "$p")"
            else
              echo "::error::no narinfo published for $p"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          echo "cache size: $(du -sh site | cut -f1)"

      # A release asset rather than Pages: Pages answers HTTP 429 once more than
      # a couple of machines pull from it, and it only ever holds the newest
      # build. One release per commit means a pinned older revision still
      # resolves, and consumers re-serve the asset from their own cache.
      - name: Publish the binary cache as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tar -c --zstd -f binary-cache.tar.zst -C site .

          # The tag carries the commit, so a consumer can build the download URL
          # from the flake revision it has locked without asking the API
          # anything. The cache- prefix is required, not decoration: GitHub
          # refuses a tag that is exactly 40 or 64 hex characters, which a bare
          # SHA is.
          tag="cache-${{ github.sha }}"

          gh release create "$tag" \
            --title "Kernel cache for ${{ github.sha }}" \
            --notes "Signed Nix binary cache for \`linux-pinephone-megi\` built from ${{ github.sha }}. Extract and use as a \`file://\` substituter." \
            || echo "release already exists, replacing the asset"

          # Clobber, because the weekly rebuild republishes the same commit.
          gh release upload "$tag" binary-cache.tar.zst --clobber

  # GitHub disables a scheduled workflow once its repository has gone 60 days
  # without a commit, and a disabled workflow ignores pushes too: from October
  # 2026 the weekly rebuild stopped, and the next commit published no cache at
  # all, so consumers locked to it had nothing to download. This re-enables
  # the workflow ahead of that deadline instead of making dummy commits.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
